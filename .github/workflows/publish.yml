name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # =========================================================================
  # Job 1: Run ALL tests (including API tests)
  # =========================================================================
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true  # Stop immediately if any test fails
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ADDED: Comprehensive suite of headless Qt6/EGL/XCB dependencies
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libopengl0 \
            libglx-mesa0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            x11-utils \
            xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # ADDED: xvfb-run automatically handles the DISPLAY variable and headless server
      - name: Run ALL tests (library, API, scripts, integration)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a python -m pytest tests/ -v --tb=short
          else
            python -m pytest tests/ -v --tb=short
          fi
          
      - name: Verify package imports
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a python -c "from src.core.flow_model import TwoPhaseFlowModel; print('Import OK')"
          else
            python -c "from src.core.flow_model import TwoPhaseFlowModel; print('Import OK')"
          fi

  # =========================================================================
  # Job 2: Build the package (only if ALL tests pass)
  # =========================================================================
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  # =========================================================================
  # Job 3: Publish directly to PyPI (no TestPyPI)
  # =========================================================================
  publish:
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: pypi
      url: https://pypi.org/p/pydebflow

    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}